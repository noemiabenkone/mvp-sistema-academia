name: CI MVP Academia

on:
  push:
    branches: [ main, feature/mvp-academia ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar verificação da aplicação
      run: |
        python -c "import app.main; print('Aplicação carregada com sucesso!')"